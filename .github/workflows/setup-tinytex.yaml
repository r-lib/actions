on:
  push:
    branches: [main, master, v2-branch]
  pull_request:
    branches: [main, master, v2-branch]
  workflow_dispatch:

name: "setup-tinytex test"

permissions: read-all

jobs:
  tinytex:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest   }
          - { os: windows-latest }
          - { os: ubuntu-latest  }

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./setup-tinytex
        env:
          TINYTEX_INSTALLER: TinyTeX

      - run: tlmgr --version

      - run: tlmgr update --self

      - run: tlmgr --version

      - run: tlmgr install colortbl grfext ae

  tinytex-rtools:
    # tlmgr used to hang on Windows with Rtools on the PATH (#1118)
    runs-on: windows-latest
    name: windows-latest (with setup-r)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./setup-r

      - uses: ./setup-tinytex

      - run: tlmgr update --self

      - run: tlmgr install ae babel-english pdflscape pdfpages sidecap
        timeout-minutes: 10

      - run: tlmgr list --only-installed
