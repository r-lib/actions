on:
  workflow_dispatch:

name: Rtools test

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }}, R ${{ matrix.config.r }}, Rtools ${{ matrix.config.rtools-version || 'default' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # default Rtools for R release (rtools45)
          - { os: windows-latest,  r: 'release',                         rtools-dir: 'C:\rtools45' }
          # default Rtools for R devel (rtools45)
          - { os: windows-latest,  r: 'devel',                           rtools-dir: 'C:\rtools45' }
          # manually select an older Rtools
          - { os: windows-latest,  r: 'release', rtools-version: '44',   rtools-dir: 'C:\rtools44' }
          # rtools40 and rtools35 are downloaded from the CRAN archive (#1121)
          - { os: windows-latest,  r: '4.1',     rtools-version: '40',   rtools-dir: 'C:\rtools40' }
          - { os: windows-latest,  r: '3.6',     rtools-version: '35',   rtools-dir: 'C:\Rtools' }
          # aarch64 Rtools
          - { os: windows-11-arm,  r: 'release',                         rtools-dir: 'C:\rtools45-aarch64' }
          - { os: windows-11-arm,  r: 'release', rtools-version: '45',   rtools-dir: 'C:\rtools45-aarch64' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./setup-pandoc

      - uses: ./setup-r
        with:
          r-version: ${{ matrix.config.r }}
          rtools-version: ${{ matrix.config.rtools-version }}
          use-public-rspm: true

      - name: "Check what version of Rtools is installed"
        run: |
          Get-ChildItem C:\
          if (-not (Test-Path "${{ matrix.config.rtools-dir }}")) {
            Write-Error "Rtools not found at ${{ matrix.config.rtools-dir }}"
            exit 1
          }
        shell: pwsh

      - name: "Install package from source"
        run: |
          install.packages("filelock", type = "source")
          library(filelock)
        shell: Rscript {0}
